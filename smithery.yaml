# Smithery configuration for Crédito & Score
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_credito

name: credito-mcp
displayName: "Crédito & Score"
description: >
  Score e análise de crédito de pessoas e empresas: score, dossiê, negativações, relatórios positivos, SCR do Banco Central e protestos. Hospedado pela plataforma, sem credenciais, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/credito-mcp
repository: https://github.com/mcp-dir/credito-mcp

tags:
  - credito
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_credito

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_credito/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
